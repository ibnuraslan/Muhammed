<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Display; src: url(/fonts/Montserrat-ExtraBold.ttf); font-weight: 100 900; }
  body { margin: 0; background: #000; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head><body>
<script type="module">
import { makeRenderer, Stage, FPS } from '/animator/engine.js';
window.onerror = (m) => console.error('page error: ' + m);
await document.fonts.load('900 40px Display');
const ep = await import('/episode.js');
const renderer = makeRenderer();
let stage = null, frames = 1;
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
window.shotIds = () => Object.keys(ep.shots);
window.setupShot = (id, n) => {
  if (stage) stage.dispose();
  const make = ep.shots[id];
  if (!make) return false;
  stage = new Stage(renderer, hash(id));
  frames = n; stage.duration = n / FPS;
  stage.update = make(stage) || null;
  return true;
};
window.renderFrame = (i) => {
  const t = i / FPS, u = frames > 1 ? i / (frames - 1) : 0;
  stage.frame(t, u);
  return renderer.domElement.toDataURL('image/jpeg', 0.93);
};
window.ready = true;
</script>
</body></html>
